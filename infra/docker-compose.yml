# nAI Stack - Docker Compose Configuration
# =========================================
#
# Usage:
#   docker compose up -d
#   docker exec nai-ollama ollama pull llama3.2   # first run: download an LLM (optional)
#
# Then add your NAS folders as sources (UI: Sources tab, or POST /sources with a path
# under /shares). nAI indexes them in place and keeps the index in sync.
#
# Services:
#   - nai-core: API + web UI on http://localhost:8000. Semantic search runs inside it (no vector DB).
#   - ollama:   Local LLM server (optional; or point NAI_LLM_BASE_URL at Ollama on another PC)

services:
  nai-core:
    build:
      context: ..
      dockerfile: apps/nai-core/Dockerfile
    container_name: nai-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - nai-data:/app/data
      # NAS folders to index, read-only. Adjust the host paths to your shares.
      - ${NAI_SHARES_DIR:-./shares}:/shares:ro
    environment:
      - NAI_LOG_LEVEL=INFO

      # Auth: on by default. The first account you create in the UI becomes admin.
      - NAI_AUTH_ENABLED=true

      # LLM. "auto" picks the largest installed Ollama model that fits this machine.
      # A GPU on another PC? Set NAI_LLM_BASE_URL=http://<pc-ip>:11434 instead.
      - NAI_LLM_ENABLED=true
      - NAI_LLM_PROVIDER=ollama
      - NAI_LLM_MODEL=auto
      - NAI_LLM_BASE_URL=http://ollama:11434

      # Semantic search (multilingual model, downloaded once into the data volume)
      - NAI_EMBEDDINGS_ENABLED=true
      # Cross-encoder reranking: off by default. The bundled reranker is English-only and didn't
      # help on the multilingual nai-bench; see docs/KNOWN_ISSUES.md before turning it on.
      - NAI_RERANKER=false

      - NAI_RATE_LIMIT_ENABLED=true
      - NAI_RATE_LIMIT_REQUESTS=100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nai-network

  ollama:
    image: ollama/ollama:0.40.17
    container_name: nai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU support (uncomment for NVIDIA; for AMD use the ollama/ollama:<version>-rocm image)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - nai-network

networks:
  nai-network:
    driver: bridge

volumes:
  nai-data:
    driver: local
  ollama-data:
    driver: local
