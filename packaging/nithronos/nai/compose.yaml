version: '3.9'

# nAI for NithronOS: "the AI that knows your NAS".
# Indexes NithronOS shares (read-only) and answers questions about them with citations.

services:
  nai:
    image: ghcr.io/nithron/nithronai/nai-core:${NAI_VERSION:-0.4.0}
    container_name: nos-app-nai-nai-1
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAI_PORT:-8090}:8000"
    volumes:
      # Database, uploads and downloaded models (embedding/reranker, ~0.5 GB)
      - ./data:/app/data
      # NithronOS shares, read-only: nAI never changes your files
      - ${SHARES_PATH:-/srv/shares}:/shares:ro
    environment:
      - NAI_AUTH_ENABLED=true
      - NAI_SOURCES_ALLOWED_ROOTS=["/shares"]
      - NAI_EMBEDDINGS_ENABLED=true
      - NAI_RERANKER=${RERANKER:-auto}
      - NAI_OCR_ENABLED=${OCR_ENABLED:-true}
      - NAI_OCR_LANGUAGES=${OCR_LANGUAGES:-eng+deu}
      # Answers from a language model (optional). Without one, nAI answers with exact
      # quotes from your files. Point this at Ollama on the NAS or on a PC with a GPU.
      - NAI_LLM_ENABLED=${LLM_ENABLED:-false}
      - NAI_LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - NAI_LLM_MODEL=${LLM_MODEL:-auto}
      - NAI_LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - NAI_LLM_API_KEY=${LLM_API_KEY:-}
      - NAI_TRUSTED_PROXIES=${TRUSTED_PROXIES:-[]}
      - TZ=${TZ:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    labels:
      - "nos.app.id=nai"
      - "nos.app.name=nAI"
      - "nos.app.version=${NAI_VERSION:-0.4.0}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
