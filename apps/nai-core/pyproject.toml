# Tooling configuration for nAI Core (dependencies live in requirements*.txt)

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI uses function calls (Depends, Query, File) in argument defaults
    "RUF001", # ambiguous unicode in strings (license/typography quotes)
    "RUF002",
    "RUF003",
    "RUF022", # keep __all__ grouped by topic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
