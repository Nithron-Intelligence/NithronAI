name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NAI_DEBUG: "true"
  NAI_LLM_ENABLED: "false"
  NAI_EMBEDDINGS_ENABLED: "false"
  NAI_AUTH_ENABLED: "false"

jobs:
  # ====================
  # Linting & Type Check
  # ====================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'apps/nai-core/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.6 mypy httpx
          pip install -r apps/nai-core/requirements.txt
      
      - name: Run Ruff (linter)
        working-directory: apps/nai-core
        run: ruff check app tests --output-format=github
      
      - name: Run Ruff (formatter check)
        working-directory: apps/nai-core
        run: ruff format app tests --check
      
      - name: Run MyPy (type check)
        working-directory: apps/nai-core
        run: mypy app

      - name: Lint and type-check evals (nai-bench) and training
        run: |
          ruff check --config apps/nai-core/pyproject.toml evals training --output-format=github
          ruff format --config apps/nai-core/pyproject.toml evals training --check
          mypy --ignore-missing-imports evals/*.py evals/retrieval/eval_retrieval.py evals/answers/eval_answers.py evals/nai-bench/build_corpus.py
          (cd training/embed && mypy --ignore-missing-imports common.py check_overlap.py generate_pairs.py train.py)

  # ====================
  # Tests
  # ====================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'apps/nai-core/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -r apps/nai-core/requirements.txt
      
      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"
      
      - name: Run tests
        working-directory: apps/nai-core
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Run nai-bench and training-guard tests
        run: pytest evals/tests training/tests -v
      
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: apps/nai-core/coverage.xml
          fail_ci_if_error: false

  # ====================
  # API Integration Test
  # ====================
  api-test:
    name: API Integration Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r apps/nai-core/requirements.txt
          pip install httpx
      
      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"
      
      - name: Start API server
        working-directory: apps/nai-core
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
      
      - name: Health check
        run: |
          curl -f http://localhost:8000/health
      
      - name: Test ingest endpoint
        run: |
          echo "Test document for nAI" > test_doc.txt
          curl -X POST http://localhost:8000/ingest \
            -F "files=@test_doc.txt" \
            -f
      
      - name: Test ask endpoint
        run: |
          curl -X POST http://localhost:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question": "What is this document about?", "top_k": 3}' \
            -f

      - name: Test streaming endpoint
        run: |
          curl -sN -X POST http://localhost:8000/ask/stream \
            -H "Content-Type: application/json" \
            -d '{"question": "What is this document about?"}' -f | tee stream.txt
          grep -q "event: done" stream.txt

      - name: Test OpenAI-compatible API and MCP endpoint
        run: |
          curl -sf http://localhost:8000/v1/models | grep -q '"id":"nai"'
          curl -sf -X POST http://localhost:8000/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model": "nai", "messages": [{"role": "user", "content": "What is this document about?"}]}' \
            | grep -q '"object":"chat.completion"'
          curl -sf -X POST http://localhost:8000/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "tools/list"}' | grep -q search_files

  # ====================
  # Docker Build
  # ====================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/nai-core/Dockerfile
          push: false
          load: true  # Load image into local Docker daemon
          tags: nai-core:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run -d --name nai-test -p 8000:8000 nai-core:test
          sleep 15  # Give more time for startup
          curl -f http://localhost:8000/health
          docker stop nai-test

  # ====================
  # Retrieval Evaluation
  # ====================
  eval:
    name: Retrieval Evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, api-test]
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r apps/nai-core/requirements.txt
          pip install httpx
      
      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"
      
      - name: Start API server (embeddings on, nai-bench corpus allowed as a source)
        working-directory: apps/nai-core
        env:
          NAI_EMBEDDINGS_ENABLED: "true"
          NAI_SOURCES_ALLOWED_ROOTS: '["${{ github.workspace }}/evals/nai-bench"]'
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 90); do curl -sf http://localhost:8000/health && exit 0; sleep 2; done
          echo "nAI did not start" && exit 1

      # No Tesseract here, so scanned files are not indexed and their questions miss:
      # compare CI numbers only with earlier CI runs, not with evals/results/ baselines.
      - name: Run nai-bench (retrieval + extractive answers)
        run: |
          python evals/run_baseline.py --no-llm --label ci --out-dir eval-results \
            --index-corpus "${{ github.workspace }}/evals/nai-bench/corpus"
        continue-on-error: true

      - name: Upload evaluation results
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval-results/
        if: always()

